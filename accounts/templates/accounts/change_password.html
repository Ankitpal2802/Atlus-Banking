{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Online Banking Password &mdash; ATLUS-BANK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/extra/style.css' %}">
</head>
<body class="extra-page">
    <div class="extra-nav">
        <a href="{% url 'accounts:dashboard' %}" class="logo-link">
            <img src="{% static 'accounts/orig/bank-logo.jpeg' %}" alt="logo">
            ATLUS-BANK
        </a>
        <div class="nav-right">
            <a href="{% url 'accounts:my_account' %}">My Account</a>
            <a href="{% url 'accounts:logout' %}">Log out</a>
        </div>
    </div>

    <div class="extra-wrap" style="max-width:480px;">
        <div class="extra-card">
            <h1 style="font-size:1.3rem;">Set Online Banking Password</h1>
            <p class="empty-note" style="margin-bottom:1.2rem;">Change the password you use to log in.</p>

            {% if error %}<div class="alert-box error">{{ error }}</div>{% endif %}

            <form method="post" class="extra-form">
                {% csrf_token %}
                <div class="field">
                    <label for="current_password">Current password</label>
                    <input type="password" id="current_password" name="current_password" required>
                </div>
                <div class="field">
                    <label for="new_password">New password</label>
                    <input type="password" id="new_password" name="new_password" required minlength="8">
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm new password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
                </div>
                <button type="submit" class="btn-teal" style="width:100%;">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
