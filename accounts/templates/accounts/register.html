{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'accounts/orig/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Open an Account</h1>
        {% if errors %}
            {% for error in errors %}
            <div class='alert alert-danger'>{{ error }}</div>
            {% endfor %}
        {% endif %}
        {% if success %}
            <div class='alert alert-success'>{{ success }}</div>
        {% endif %}
        <form action="{% url 'accounts:register' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" class="form-control" name="fullname" placeholder="Full Name:" value="{{ posted.fullname|default:'' }}">
            </div>
            <div class="form-group">
                <input type="email" class="form-control" name="email" placeholder="Email:" value="{{ posted.email|default:'' }}">
            </div>
            <div class="form-group">
                <input type="text" class="form-control" name="Account" placeholder="Account Number:" value="{{ posted.account|default:'' }}">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" name="password" placeholder="Password:">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" name="repeat_password" placeholder="Repeat Password:">
            </div>
            <div class="form-btn">
                <input type="submit" class="btn btn-primary" value="Register" name="submit">
            </div>
        </form>
        <div>
        <div><p>Already Registered <a href="{% url 'accounts:login' %}">Login Here</a></p></div>
      </div>
    </div>
</body>
</html>
